name: Build Evil Spotify IPA (one-shot)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to a decrypted Spotify IPA"
        required: true
        type: string

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3.0"

      - name: Download IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"; exit 1
          fi

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Build EeveeSwiftProtobuf.framework
        run: make build-eeveeswiftprotobuf

      - name: Build Evil Spotify .deb (rootless)
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="rootless"
          ls -la packages
          mkdir -p Outputs/DEBS
          cp -f "$(ls -t packages/*.deb | head -n 1)" Outputs/DEBS/evil-spotify.deb

      - name: Inject deb into IPA (cyan)
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"; mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R Outputs/DEBS/evil-spotify.deb "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          OUT="Outputs/IPAS/EvilSpotify-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Fetch OpenSpotifySafariExtension (.appex)
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject Safari extension, strip Watch app
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload

          unzip -q "$(basename "$OUT_IPA")"
          mkdir -p "Payload/Spotify.app/PlugIns"
          rm -rf "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi

          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Create Patched Duplicate & LC-inject zxPluginsInject
        run: |
          PATCHED_OUT="${OUT_IPA%.ipa}-patched.ipa"
          cp "$OUT_IPA" "$PATCHED_OUT"
          ipapatch --input "$PATCHED_OUT" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib
          echo "PATCHED_IPA=$PATCHED_OUT" >> $GITHUB_ENV

      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Rename app to Evil Spotify (patched duplicate inherits via copy)
        run: |
          chmod +x Tools/evil-rename.sh
          Tools/evil-rename.sh "$OUT_IPA"

      - name: Verify Evil branding in IPA
        run: |
          tmp=$(mktemp -d)
          (cd "$tmp" && unzip -q "$GITHUB_WORKSPACE/$OUT_IPA" Payload/Spotify.app/Info.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$tmp/Payload/Spotify.app/Info.plist" 2>/dev/null || echo missing)
          echo "App name: $NAME"
          [ "$NAME" = "Evil Spotify" ] || { echo "::error::Evil rename missing"; exit 1; }
          ICONS=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons' "$tmp/Payload/Spotify.app/Info.plist" 2>/dev/null | grep -c Evil || true)
          [ "$ICONS" -ge 1 ] || { echo "::error::Evil icon not registered"; exit 1; }
          ls -la "$GITHUB_WORKSPACE/$OUT_IPA" "$GITHUB_WORKSPACE/$PATCHED_IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvilSpotify-IPA
          path: |
            ${{ env.OUT_IPA }}
            ${{ env.PATCHED_IPA }}
          if-no-files-found: error

      - name: Upload IPAs to filebin.net
        run: |
          BIN="evil-spotify-$(date +%s)"
          cd "$(dirname "$OUT_IPA")"
          for f in "$(basename "$OUT_IPA")" "$(basename "$PATCHED_IPA")"; do
            curl -s -X POST --data-binary "@$f" -H "Content-Type: application/octet-stream" \
                 "https://filebin.net/$BIN/$f" -o /dev/null -w "uploaded $f: %{http_code}\n"
          done
          echo "### 📦 filebin.net download" >> $GITHUB_STEP_SUMMARY
          echo "https://filebin.net/$BIN/" >> $GITHUB_STEP_SUMMARY
          echo "Bin expires automatically in 3 days." >> $GITHUB_STEP_SUMMARY
